<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Badak Putih - Masuk Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
            background: linear-gradient(135deg, #fff9e8 0%, #e8f5ff 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; position: relative; overflow: hidden;
        }
        .shape { position: absolute; border-radius: 50%; z-index: 0; filter: blur(10px); opacity: 0.6; }
        .shape-1 { width: 300px; height: 300px; background: #ffe6b3; top: -100px; left: -100px; }
        .shape-2 { width: 250px; height: 250px; background: #d0edff; bottom: -80px; right: -50px; }

        .login-card {
            background: rgba(255, 255, 255, 0.95); padding: 45px 40px; border-radius: 32px;
            box-shadow: 0 20px 40px rgba(45, 62, 80, 0.06); border: 4px solid #ffffff;
            width: 100%; max-width: 440px; text-align: center; position: relative; z-index: 1;
        }
        .avatar-box {
            width: 90px; height: 90px; background: #ffb347; border-radius: 50%;
            margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; box-shadow: 0 8px 0 #e69524;
        }
        h2 { color: #2d3e50; font-size: 1.8rem; margin-bottom: 8px; font-weight: 700; }
        .subtitle { color: #7a8b9e; font-size: 0.95rem; margin-bottom: 35px; }
        .form-group { text-align: left; margin-bottom: 22px; }
        label { display: block; font-size: 0.9rem; font-weight: 600; color: #4a5d6e; margin-bottom: 8px; padding-left: 6px; }
        .input-control {
            width: 100%; padding: 15px 20px; border: 2px solid #e2e8f0; border-radius: 20px;
            font-size: 1rem; color: #2d3e50; outline: none; background-color: #fcfdfa; transition: all 0.3s ease;
        }
        .input-control:focus { border-color: #2196f3; background-color: #ffffff; box-shadow: 0 0 0 5px rgba(33, 150, 243, 0.12); }
        
        .btn-login {
            width: 100%; padding: 16px; background: #2196f3; color: #ffffff; border: none;
            border-radius: 20px; font-size: 1.1rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 6px 0 #1565c0; transition: all 0.15s ease; margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(2px); box-shadow: 0 4px 0 #1565c0; }
        .btn-login:active { transform: translateY(6px); box-shadow: 0 0 0 #1565c0; }
        
        .auth-footer { margin-top: 30px; font-size: 0.9rem; color: #7a8b9e; line-height: 1.6; }
        .auth-footer a { color: #ffb347; text-decoration: none; font-weight: 700; }
        .back-link { display: inline-block; margin-top: 15px; color: #9cb2c9; font-size: 0.85rem; text-decoration: none; }
        .demo-info {
            background: #f0f7ff; padding: 12px; border-radius: 16px; margin-top: 20px;
            font-size: 0.8rem; color: #555;
        }
    </style>
</head>
<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="login-card">
        <div class="avatar-box">🦏</div>
        <h2>Selamat Datang!</h2>
        <p class="subtitle">Silakan masuk ke Akun Orang Tua / Guru</p>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="input-control" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" class="input-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login">Yuk Masuk ✨</button>
        </form>

        <div class="demo-info">
            <strong>🔐 Demo Akun:</strong><br>
            Admin: admin / admin123<br>
            Guru: guru / guru123<br>
            Orang Tua: budi / budi123
        </div>

        <div class="auth-footer">
            Belum terdaftar? <a href="/register">Buat Akun Baru</a><br>
            <a href="/" class="back-link">← Kembali ke Beranda Utama</a>
        </div>
    </div>
</body>
</html>
